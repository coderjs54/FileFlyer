name: Build and Release

on:
  # 推送 v 开头的标签时发布，例如 v0.1.0
  push:
    tags:
      - "v*"
  # 也可以手动触发并指定标签
  workflow_dispatch:
    inputs:
      tag:
        description: "发布标签，例如 v0.1.0"
        required: true
        default: "v0.1.0"
      draft:
        description: "创建为草稿 Release"
        type: boolean
        required: false
        default: true
      ios_export_method:
        description: "iOS 导出方式"
        type: choice
        required: true
        default: "release-testing"
        options:
          - release-testing
          - app-store-connect

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------
  # Windows / macOS / Linux 桌面端
  # ------------------------------------------------------------
  desktop:
    name: Desktop / ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            platform: windows-latest
            args: ""
            rust_targets: ""
          - name: macos
            platform: macos-latest
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - name: linux
            platform: ubuntu-22.04
            args: "--bundles deb,appimage"
            rust_targets: ""
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Linux system dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Build desktop bundles
        run: npx tauri build ${{ matrix.args }}

      - name: Collect Windows portable executable
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item src-tauri/target/release/fileflyer.exe artifacts/FileFlyer-portable.exe

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            artifacts/FileFlyer-portable.exe
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------
  # Android APK / AAB
  # 配置签名 Secrets 时生成正式签名包，否则回退为调试 APK
  # ------------------------------------------------------------
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_ROOT" ]; then
            SDK_ROOT="/usr/local/lib/android/sdk"
          fi
          SDKMANAGER=""
          for candidate in "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "找不到 sdkmanager"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.1.12297006"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDK_ROOT/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize Android project
        run: npx tauri android init --ci --skip-targets-install

      - name: Apply Android app icons
        run: cp -R src-tauri/icons/android/. src-tauri/gen/android/app/src/main/res/

      - name: Configure Android release signing
        if: env.ANDROID_KEY_BASE64 != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != ''
        run: |
          printf '%s' "$ANDROID_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/release-key.jks"
          node scripts/configure-android-signing.mjs "$RUNNER_TEMP/release-key.jks"

      - name: Build signed release APK and AAB
        if: env.ANDROID_KEY_BASE64 != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != ''
        run: |
          npx tauri android build --apk --target aarch64
          npx tauri android build --aab --target aarch64

      - name: Build debug APK fallback
        if: env.ANDROID_KEY_BASE64 == '' || env.ANDROID_KEY_ALIAS == '' || env.ANDROID_KEY_PASSWORD == ''
        run: npx tauri android build --apk --debug --target aarch64

      - name: Collect Android artifacts
        run: |
          mkdir -p artifacts/android
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          find src-tauri/gen/android/app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) -print0 |
            while IFS= read -r -d '' file; do
              base=$(basename "$file")
              suffix=${base#app-universal-}
              cp "$file" "artifacts/android/FileFlyer_${VERSION}_android_${suffix}"
            done
          ls -lh artifacts/android

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: artifacts/android/*
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------
  # iOS
  # 配置签名 Secrets 时生成 IPA，否则构建模拟器 App 作为 CI 产物
  # ------------------------------------------------------------
  ios:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      IOS_EXPORT_METHOD: ${{ github.event_name == 'workflow_dispatch' && inputs.ios_export_method || 'release-testing' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust iOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Detect iOS signing secrets
        id: ios-signing
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: |
          if [ -n "$APPLE_DEVELOPMENT_TEAM" ] && [ -n "$IOS_CERTIFICATE" ] && [ -n "$IOS_CERTIFICATE_PASSWORD" ] && [ -n "$IOS_MOBILE_PROVISION" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Initialize iOS project
        env:
          # 未配置签名时使用占位 Team ID，仅用于无签名的模拟器构建
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM || '0000000000' }}
        run: npx tauri ios init --ci --skip-targets-install

      # Tauri iOS CLI 使用短名称：aarch64（真机）、aarch64-sim（Apple Silicon 模拟器）、x86_64（Intel 模拟器）
      - name: Build signed IPA
        if: steps.ios-signing.outputs.enabled == 'true'
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: npx tauri ios build --ci --target aarch64 --export-method "$IOS_EXPORT_METHOD"

      - name: Build unsigned simulator app
        if: steps.ios-signing.outputs.enabled != 'true'
        run: |
          if [ "$(uname -m)" = "arm64" ]; then
            TARGET=aarch64-sim
          else
            TARGET=x86_64
          fi
          npx tauri ios build --ci --no-sign --target "$TARGET"

      - name: Collect iOS artifacts
        run: |
          mkdir -p artifacts/ios
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          find src-tauri/gen/apple src-tauri/target -type f -name "*.ipa" -exec cp {} artifacts/ios/ \; 2>/dev/null || true
          if [ -z "$(ls -A artifacts/ios)" ]; then
            APP=$(find src-tauri/gen/apple src-tauri/target -type d -name "*.app" 2>/dev/null | head -n 1 || true)
            if [ -n "$APP" ]; then
              (cd "$(dirname "$APP")" && zip -r "$GITHUB_WORKSPACE/artifacts/ios/FileFlyer_${VERSION}_ios-simulator.zip" "$(basename "$APP")")
            fi
          else
            for ipa in artifacts/ios/*.ipa; do
              mv "$ipa" "artifacts/ios/FileFlyer_${VERSION}_ios.ipa"
            done
          fi
          ls -lh artifacts/ios

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: artifacts/ios/*
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------
  # 汇总所有产物并创建 GitHub Release
  # ------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [desktop, android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Collect release assets
        run: |
          mkdir -p release
          find release-assets -type f \( \
            -name "*.msi" -o \
            -name "*.exe" -o \
            -name "*.dmg" -o \
            -name "*.deb" -o \
            -name "*.AppImage" -o \
            -name "*.apk" -o \
            -name "*.aab" -o \
            -name "*.ipa" \
          \) -exec cp -v {} release/ \;
          if [ -z "$(ls -A release)" ]; then
            echo "没有可发布的构建产物"
            exit 1
          fi
          cd release
          sha256sum * > SHA256SUMS.txt
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: FileFlyer ${{ env.RELEASE_TAG }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: false
          fail_on_unmatched_files: true
          files: release/*
          body: |
            ## FileFlyer ${{ env.RELEASE_TAG }}

            ### 安装包
            - Windows：`.msi`、NSIS 安装程序、`FileFlyer-portable.exe`（免安装）
            - macOS：`.dmg`
            - Linux：`.deb` / `.AppImage`
            - Android：`.apk` / `.aab`
            - iOS：`.ipa`（仅在配置 iOS 签名 Secrets 时生成）

            ### 说明
            - 桌面端安装包默认未启用代码签名，Windows 与 macOS 可能触发系统安全提示。
            - 未配置 Android 签名 Secrets 时，Android 资产为调试 APK。
            - 可在 `SHA256SUMS.txt` 中核对下载文件完整性。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
