[package]
name = "fileflyer"
version = "0.1.4"
description = "局域网文件互传"
authors = ["FileFlyer"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "fileflyer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "fs", "io-util", "time", "sync", "macros"] }
tokio-util = "0.7"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
hostname = "0.4"
if-addrs = "0.15"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
